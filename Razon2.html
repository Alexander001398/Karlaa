
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Razón #2 ❤️</title>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#f6d365,#fda085,#ff9a9e,#a18cd1);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
    overflow-x:hidden;
    color:white;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

header{
    position:sticky;
    top:0;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    padding:20px;
    z-index:1000;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    padding:12px 20px;
    border-radius:30px;
    transition:.4s;
}

nav a:hover{
    background:#ff4d6d;
    transform:translateY(-5px);
}

.contenedor{
    width:90%;
    max-width:1200px;
    margin:auto;
    text-align:center;
    padding:50px;
}

h1{
    font-size:55px;
    text-shadow:3px 3px 10px black;
}

.subtitulo{
    margin-top:20px;
    font-size:24px;
}

/* ===== RELOJ ===== */

.reloj{

width:320px;
height:320px;
margin:60px auto;
border:15px solid #FFD700;
border-radius:50%;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
box-shadow:0 0 35px rgba(255,255,255,.8);
cursor:pointer;
position:relative;
transition:.5s;

display:flex;
justify-content:center;
align-items:center;

}

.reloj:hover{

transform:scale(1.05) rotate(5deg);

}

.reloj::before{

content:"🕰️";

font-size:120px;

}

.mensaje{

display:none;

background:rgba(255,255,255,.18);

backdrop-filter:blur(12px);

padding:30px;

border-radius:20px;

margin-top:40px;

font-size:22px;

line-height:1.8;

}

.foto{

width:350px;
height:350px;
object-fit:cover;
margin-top:30px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,255,255,.8);
transition:.5s;

}

.foto:hover{

transform:scale(1.06);

}

/* TARJETA SPOTIFY */

.spotify-card{

width:750px;
max-width:95%;
margin:40px auto;
display:flex;
gap:20px;
align-items:center;
padding:20px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(15px);

border-radius:25px;

}

.cover{

width:180px;
height:180px;
border-radius:15px;
object-fit:cover;

}

.info{

flex:1;
text-align:left;

}

.info h2{

margin-bottom:10px;

}

.info h3{

margin-bottom:10px;

}

.info audio{

width:100%;

}

/* BOTONES */

.botones{

margin-top:40px;

}

.botones button{

padding:15px 35px;

font-size:20px;

border:none;

border-radius:30px;

background:#ff4d6d;

color:white;

margin:10px;

cursor:pointer;

transition:.4s;

}

.botones button:hover{

transform:scale(1.08);

background:#ff1744;

}

/* ICONOS */

.icono{

position:fixed;

top:-30px;

font-size:25px;

animation:caer linear forwards;

}

@keyframes caer{

to{

transform:translateY(110vh);

opacity:0;

}

}

@media(max-width:768px){

.spotify-card{

flex-direction:column;

text-align:center;

}

.info{

text-align:center;

}

.cover{

width:150px;
height:150px;

}

.reloj{

width:240px;
height:240px;

}

}
</style>

<div class="contenedor">

<h1>⏳ Razón #3</h1>

<p class="subtitulo">
Porque contigo el tiempo pasa demasiado rápido 
</p>

<div class="reloj" id="reloj" onclick="abrirReloj()"></div>

<div class="mensaje" id="mensaje">

<h2>Porque contigo el tiempo pasa rapido </h2>

<br>

<p id="texto"></p>

<br>

<img src="Imagenes/imagen5.jpg" class="foto" alt="Nuestra Foto">

<script>

const mensaje = `

aunque aveces no sentimos el tiempo que estamos juntos pero cada segundos aprovecho para estar con vos,pero lo aprovecho de la mejor . ❤️



`;

let i = 0;

function abrirReloj(){

document.getElementById("reloj").style.transform="scale(0) rotate(720deg)";

setTimeout(()=>{

document.getElementById("reloj").style.display="none";

document.getElementById("mensaje").style.display="block";

escribir();

},800);

}

function escribir(){

if(i < mensaje.length){

document.getElementById("texto").innerHTML += mensaje.charAt(i);

i++;

setTimeout(escribir,35);

}

}
// ⭐ Iconos cayendo

function crearIcono(){

    const icono=document.createElement("div");

    icono.classList.add("icono");

    const iconos=["⭐","⏰","✨","💖"];

    icono.innerHTML=iconos[Math.floor(Math.random()*iconos.length)];

    icono.style.left=Math.random()*100+"vw";

    icono.style.fontSize=(20+Math.random()*25)+"px";

    icono.style.animationDuration=(4+Math.random()*5)+"s";

    document.body.appendChild(icono);

    setTimeout(()=>{

        icono.remove();

    },9000);

}

setInterval(crearIcono,300);

</script>
