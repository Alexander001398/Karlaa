<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razón #1 ❤️</title>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364,#6a11cb,#8E2DE2);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
    color:white;
    overflow-x:hidden;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

header{
    position:sticky;
    top:0;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    padding:20px;
    z-index:1000;
}

nav ul{
    display:flex;
    justify-content:center;
    gap:15px;
    list-style:none;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    padding:12px 20px;
    border-radius:30px;
    transition:.4s;
}

nav a:hover{
    background:#ff4d6d;
    transform:translateY(-4px);
}

.contenedor{
    width:90%;
    max-width:1100px;
    margin:auto;
    text-align:center;
    padding:40px;
}

h1{
    font-size:55px;
    text-shadow:3px 3px 12px black;
    margin-bottom:20px;
}

.subtitulo{
    font-size:22px;
    margin-bottom:40px;
}

/* SOBRE */

.sobre{
    width:320px;
    height:220px;
    margin:40px auto;
    position:relative;
    cursor:pointer;
    perspective:1000px;
}

.tapa{
    position:absolute;
    width:100%;
    height:110px;
    background:#ff7aa2;
    clip-path:polygon(0 0,50% 100%,100% 0);
    transform-origin:top;
    transition:1s;
    z-index:2;
}

.base{
    position:absolute;
    bottom:0;
    width:100%;
    height:160px;
    background:#ffc1d6;
    border-radius:0 0 15px 15px;
}

.carta{
    position:absolute;
    left:20px;
    top:40px;
    width:280px;
    height:150px;
    background:white;
    color:#333;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    transition:1s;
    z-index:1;
}

.sobre.abierto .tapa{
    transform:rotateX(180deg);
}

.sobre.abierto .carta{
    transform:translateY(-150px);
}

.mensaje{
    display:none;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:20px;
    margin-top:50px;
    line-height:1.8;
}

.foto{
    width:340px;
    height:340px;
    object-fit:cover;
    border-radius:20px;
    margin:30px auto;
    display:block;
    box-shadow:0 0 30px rgba(255,255,255,.8);
    transition:.5s;
}

.foto:hover{
    transform:scale(1.05) rotate(2deg);
}

/* TARJETA MÚSICA */

.spotify-card{
    display:flex;
    align-items:center;
    gap:20px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    max-width:750px;
    margin:40px auto;
}

.cover{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 0 20px rgba(255,255,255,.8);
}

.info{
    flex:1;
    text-align:left;
}

.info h2{
    margin-bottom:10px;
}

.info h3{
    margin-bottom:8px;
}

.info audio{
    width:100%;
}

.botones{
    margin-top:40px;
}

.botones button{
    padding:15px 35px;
    margin:10px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
}

.botones button:hover{
    transform:scale(1.08);
    background:#ff1744;
}

.corazon{
    position:fixed;
    top:-20px;
    color:#ff3366;
    animation:caer linear forwards;
}

@keyframes caer{
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

@media(max-width:768px){

.spotify-card{
    flex-direction:column;
    text-align:center;
}

.info{
    text-align:center;
}

.cover{
    width:150px;
    height:150px;
}

h1{
    font-size:40px;
}

}

</style>
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="Inicio.html">🏠 Inicio</a></li>
            <li><a href="Razon1.html">❤️ Razón 1</a></li>
            <li><a href="Razon2.html">🌹 Razón 2</a></li>
            <li><a href="Razon3.html">✨ Razón 3</a></li>
            <li><a href="Razon4.html">💕 Razón 4</a></li>
            <li><a href="Razon5.html">💖 Razón 5</a></li>
        </ul>
    </nav>
</header>

<div class="contenedor">

    <h1>❤️ Razón #1</h1>

    <p class="subtitulo">
        Tu sonrisa fue lo primero que vi.
    </p>

    <div class="sobre" id="sobre" onclick="abrirCarta()">

        <div class="tapa"></div>

        <div class="base"></div>

        <div class="carta">
            💌 Ábreme
        </div>

    </div>

    <div class="mensaje" id="mensaje">

        <h2>Tu sonrisa</h2>

        <br>

        <p id="texto"></p>

        <img src="Imagenes/imagen7.jpg" class="foto" alt="Nuestra foto">

        <div class="spotify-card">

            <img src="Portada/portada2.jpg" class="cover" alt="Portada">

            <div class="info">

               

                <h3>Reina Pepiada </h3>

                <p>Alvaro Diaz </p>

                <audio controls>
                    <source src="musica/lvaro_D_az_-_Reina_Pepiada_(mp3.pm).mp3" type="audio/mpeg">
                </audio>

            </div>

        </div>

        <div class="botones">

            <a href="index.html">
                <button>🏠 Inicio</button>
            </a>

            <a href="razon2.html">
                <button>➡️ Siguiente Razón</button>
            </a>

        </div>

    </div>

</div>

<script>

const mensaje = `Desde el primer momento en que vi tu sonrisa, supe que elegi la mejor persona para reirme y vivir esos momentos
siempre nos estamos reiliendo por pendejadas o por cualquier cosa que hacemos,te amo mucho mi negra  ❤️`;

let i = 0;

function abrirCarta(){

    document.getElementById("sobre").classList.add("abierto");

    setTimeout(function(){

        document.getElementById("mensaje").style.display = "block";

        escribirTexto();

    },900);

}

function escribirTexto(){

    if(i < mensaje.length){

        document.getElementById("texto").innerHTML += mensaje.charAt(i);

        i++;

        setTimeout(escribirTexto,35);

    }

}

function crearCorazon(){

    const corazon = document.createElement("div");

    corazon.classList.add("corazon");

    corazon.innerHTML = "❤️";

    corazon.style.left = Math.random()*100+"vw";

    corazon.style.fontSize = (20+Math.random()*25)+"px";

    corazon.style.animationDuration = (4+Math.random()*5)+"s";

    document.body.appendChild(corazon);

    setTimeout(()=>{

        corazon.remove();

    },9000);

}

setInterval(crearCorazon,300);

</script>

</body>
</html>
